name: Release

# Pushing a tag like v1.0.0 builds the zip and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifest and scripts
        run: npm run check
      - name: Build the zip
        run: npm run build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Dammer $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
