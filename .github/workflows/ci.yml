name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifest and scripts
        run: npm run check
      - name: Build the zip
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dammer
          path: dist/*.zip
